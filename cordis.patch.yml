# dsh-memory — single-purpose DSH plugin by the ainetcafe.com team.
# One mcp-client row; tools register as mcp__netcafe_memory__<name>.
- insert:
    - id: mcp-dsh-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: netcafe-memory
        transport: streamable-http
        url: https://ainetcafe.com/mcp/memory?s=dsh-memory
